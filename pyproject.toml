[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-fishmusic"
version = "0.2.0"
description = "网易云点歌，直接把歌当语音条发出来；会员歌自动换源（零 LLM 开销）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "173ababah" }]
requires-python = ">=3.9"
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.2.0", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishmusic"
Repository = "https://github.com/173ababah/nonebot-plugin-fishmusic"

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_name = "nonebot-plugin-fishmusic"
plugins = ["nonebot_plugin_fishmusic"]

[tool.pdm.build]
includes = ["nonebot_plugin_fishmusic"]